[build-system]
requires = [
    "setuptools>=42",
    "wheel"
]
build-backend = "setuptools.build_meta"

[project]
name = "df_to_azure"
version = "2.0.0"
authors = [{name = "Zypp", email = "hello@zypp.io"}]
description = "Automatically write pandas DataFrames to SQL by creating pipelines in Azure Data Factory with copy activity from blob to SQL"
readme = "README.md"
requires-python = ">=3.11,<3.14"
keywords = ["python", "azure", "data-warehouse", "sql", "blob"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "azure-identity>=1.12.0",
    "azure-mgmt-datafactory>=7.1.0",
    "azure-mgmt-resource>=23.1.1",
    "azure-storage-blob>=12.20.0",
    "pandas>=2.2.2",
    "pyarrow>=16.1.0",
    "pyodbc>=5.1.0",
    "sqlalchemy>=2.0.36",
]

[project.urls]
"Bug Tracker" = "https://github.com/zypp-io/df_to_azure/issues"
"Source" = "https://github.com/zypp-io/df_to_azure"

[tool.setuptools]
packages = ["df_to_azure"]

[dependency-groups]
dev = ["pre-commit", "pytest"]

[tool.pytest.ini_options]
log_cli = false
log_cli_level = "INFO"
log_cli_format = "%(asctime)s.%(msecs)03d [%(levelname)-5s] [%(name)s] - %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
